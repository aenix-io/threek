version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unparam
    - usestdlibvars
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests start helper processes and write temporary files on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aenix-io/threek
