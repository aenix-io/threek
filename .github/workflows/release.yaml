name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  image:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Image reference
        env:
          TAG: ${{ github.ref_name }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY}-agent:${TAG}" >> "${GITHUB_OUTPUT}"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.ref.outputs.image }}
          provenance: mode=max
          sbom: true
          push: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE%:*}@${DIGEST}"

  release:
    runs-on: ubuntu-latest
    needs:
      - ci
      - image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin the agent image in the manifests
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          for manifest in threek-agent.yaml talos-static-pod.yaml; do
            sed --regexp-extended "s|ghcr.io/[^\" ]+/threek-agent:[^\" ]+|${IMAGE}@${DIGEST}|" \
              "deploy/${manifest}" > "${manifest}"
            grep --quiet --fixed-strings "${IMAGE}@${DIGEST}" "${manifest}"
          done
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          {
            echo "## Image"
            echo
            echo "- \`${IMAGE}\`"
            echo
            echo "Manifests with this image pinned by digest:"
            echo
            echo "- \`threek-agent.yaml\`: the admission policy for etcd-operator"
            echo "- \`talos-static-pod.yaml\`: the static Pod for Talos control-plane nodes"
            echo
            echo "The image is signed with cosign keyless signing:"
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > notes.md
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "${TAG}" --notes-file notes.md --generate-notes "${prerelease[@]}" \
            threek-agent.yaml talos-static-pod.yaml
