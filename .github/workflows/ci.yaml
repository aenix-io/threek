name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        etcd:
          - v3.6.15
          - v3.7.2
    name: test (etcd ${{ matrix.etcd }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install etcd
        env:
          ETCD_VERSION: ${{ matrix.etcd }}
        run: |
          archive="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl --silent --show-error --location --fail --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/${archive}"
          grep "  ${archive}\$" build/etcd.sha256 | (cd "${RUNNER_TEMP}" && sha256sum --check --strict)
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          echo "TEST_ETCD_BINARY=${RUNNER_TEMP}/etcd-${ETCD_VERSION}-linux-amd64/etcd" >> "${GITHUB_ENV}"
      - run: go test -race ./...

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
